spring.application.name=server

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5431/smartcampus}
spring.datasource.username=${DB_USERNAME:smartcampus}
spring.datasource.password=${DB_PASSWORD:smartcampus}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Firebase Configuration
app.firebase.project-id=${FIREBASE_PROJECT_ID}
app.firebase.private-key=${FIREBASE_PRIVATE_KEY}
app.firebase.private-key-id=${FIREBASE_PRIVATE_KEY_ID}
app.firebase.client-id=${FIREBASE_CLIENT_ID}
app.firebase.client-email=${FIREBASE_CLIENT_EMAIL}

# File Uploads
app.file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Static file serving
spring.web.resources.static-locations=classpath:/static/,file:uploads/
