name: Smart Campus CI

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"

  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw
        working-directory: server

      - name: Compile
        run: ./mvnw clean compile -B -DskipTests
        working-directory: server

      - name: Checkstyle
        run: ./mvnw checkstyle:check -B
        working-directory: server
